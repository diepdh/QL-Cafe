<script>
  let SELECTED_PRODUCT_ID = null;
  let REFINED_MATERIALS = [];
  let RAW_MATERIALS = [];

  /**
   * Khởi tạo trang Công Thức
   */
  function loadRecipesPage() {
    // Fix table headers dynamically since the template in app.html might be old (4 columns instead of 5)
    const thead = document.querySelector('#recipesTemplate thead tr');
    if (thead && thead.cells.length === 4) {
      thead.innerHTML = `
        <th style="width: 120px;">Loại</th>
        <th>Nguyên liệu</th>
        <th style="width: 100px;">Số lượng</th>
        <th style="width: 60px;">Đơn vị</th>
        <th style="width: 50px;"></th>
      `;
      // Also fix initial message colspan
      const initialMsg = document.querySelector('#recipeTableBody td');
      if (initialMsg) initialMsg.colSpan = 5;
    }

    const list = document.getElementById('recipeProductList');
    if (list) list.innerHTML = '<div style="padding:12px; color:var(--text-muted); font-size:13px;"><i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>';

    // Load song song Raw và Refined
    Promise.all([
      new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getRefinedMaterials(STATE.token);
      }),
      new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getRawMaterials(STATE.token);
      })
    ]).then(([refined, raw]) => {
      if (refined.error || raw.error) {
        if (refined.error === 'UNAUTHORIZED' || raw.error === 'UNAUTHORIZED') { handleLogout(); return; }
        showToast('Lỗi tải danh sách nguyên liệu', 'error');
        return;
      }
      REFINED_MATERIALS = refined;
      RAW_MATERIALS = raw;
      loadRecipeProductList();
    }).catch(err => {
      console.error('Lỗi loadRecipesPage:', err);
      showToast('Lỗi kết nối máy chủ', 'error');
    });
  }

  /**
   * Load danh sách sản phẩm bên trái
   */
  function loadRecipeProductList() {
    const list = document.getElementById('recipeProductList');
    if (!list) return;

    google.script.run
      .withSuccessHandler(products => {
        if (!products || products.error || !Array.isArray(products)) {
          if (products && products.error === 'UNAUTHORIZED') { handleLogout(); return; }
          list.innerHTML = '<div style="padding:12px; color:red; font-size:13px;">Lỗi tải danh sách: ' + (products && products.error || 'Không xác định') + '</div>';
          return;
        }
        if (products.length === 0) {
          list.innerHTML = '<div style="padding:12px; color:var(--text-muted); font-size:13px;">Chưa có sản phẩm nào.</div>';
          return;
        }
        list.innerHTML = products.map(p => `
          <div class="nav-item" style="color:var(--text); border:1px solid var(--border); margin-bottom:8px; justify-content:space-between;" 
               id="prod-item-${p.product_id}"
               onclick="loadProductRecipe('${p.product_id}', '${p.name}')">
            <span>${p.name}</span>
            <i class="fas fa-chevron-right" style="font-size:12px; color:var(--text-muted);"></i>
          </div>
        `).join('');
      })
      .withFailureHandler(err => {
        list.innerHTML = '<div style="padding:12px; color:red; font-size:13px;">Lỗi kết nối: ' + err.message + '</div>';
      })
      .getProducts(STATE.token);
  }

  /**
   * Load công thức của 1 sản phẩm
   */
  function loadProductRecipe(productId, productName) {
    SELECTED_PRODUCT_ID = productId;
    
    document.querySelectorAll('#recipeProductList .nav-item').forEach(el => el.classList.remove('active'));
    const selectedItem = document.getElementById(`prod-item-${productId}`);
    if (selectedItem) selectedItem.classList.add('active');

    document.getElementById('recipeTitle').innerText = `Công thức: ${productName}`;
    document.getElementById('recipeActions').classList.remove('hidden');
    
    const tbody = document.getElementById('recipeTableBody');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin"></i> Đang tải...</td></tr>';

    google.script.run
      .withSuccessHandler(recipe => {
        if (!recipe || recipe.error) {
          if (recipe && recipe.error === 'UNAUTHORIZED') { handleLogout(); return; }
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red; padding:20px;">Lỗi: ${recipe && recipe.error || 'Không xác định'}</td></tr>`;
          return;
        }
        
        if (!Array.isArray(recipe) || recipe.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:40px; color:var(--text-muted);">Sản phẩm này chưa có công thức. Nhấn "+ Thêm NVL" để bắt đầu.</td></tr>';
        } else {
          tbody.innerHTML = '';
          const fragment = document.createDocumentFragment();
          recipe.forEach(item => addIngredientRow(item, fragment));
          tbody.appendChild(fragment);
        }
      })
      .withFailureHandler(err => {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red; padding:20px;">Lỗi kết nối: ${err.message}</td></tr>`;
      })
      .getRecipeByProduct(STATE.token, productId);
  }

  /**
   * Thêm 1 dòng NVL vào bảng
   */
  function addIngredientRow(data = null, parent = null) {
    const tbody = document.getElementById('recipeTableBody');
    const target = parent || tbody;
    
    // Xóa dòng thông báo nếu đang thêm dòng đầu tiên vào tbody trực tiếp
    if (!parent && tbody.rows.length === 1 && tbody.rows[0].cells.length === 1) {
      tbody.innerHTML = '';
    }

    const tr = document.createElement('tr');
    const matType = data ? data.material_type : 'refined';
    const matId = data ? data.material_id : '';

    tr.innerHTML = `
      <td style="width: 120px;">
        <select class="form-control ing-type" onchange="updateMaterialOptions(this)">
          <option value="refined" ${matType === 'refined' ? 'selected' : ''}>Tinh chế</option>
          <option value="raw" ${matType === 'raw' ? 'selected' : ''}>Thô</option>
        </select>
      </td>
      <td>
        <select class="form-control ing-id" onchange="updateRowUnit(this)">
          <option value="">-- Chọn nguyên liệu --</option>
          ${generateMaterialOptions(matType, matId)}
        </select>
      </td>
      <td style="width: 100px;">
        <input type="number" class="form-control ing-qty" value="${data ? data.quantity : 1}" step="any" min="0">
      </td>
      <td class="ing-unit" style="width: 60px; vertical-align: middle; color:var(--text-muted); font-size:13px;">
        ${data ? data.unit : '-'}
      </td>
      <td style="text-align:right; width: 50px;">
        <button class="btn btn-outline" style="color:var(--error); border:none; padding:8px;" onclick="this.closest('tr').remove()">
          <i class="fas fa-trash"></i>
        </button>
      </td>
    `;
    
    target.appendChild(tr);
    if (!data) {
      const select = tr.querySelector('.ing-id');
      if (select && select.value) updateRowUnit(select);
    }
  }

  /**
   * Sinh danh sách option nguyên liệu dựa trên loại
   */
  function generateMaterialOptions(type, selectedId = '') {
    const list = type === 'raw' ? RAW_MATERIALS : REFINED_MATERIALS;
    const idKey = type === 'raw' ? 'material_id' : 'refined_id';
    
    return list.map(m => `
      <option value="${m[idKey]}" data-unit="${m.unit}" ${String(selectedId) === String(m[idKey]) ? 'selected' : ''}>
        ${m.name}
      </option>
    `).join('');
  }

  /**
   * Cập nhật danh sách nguyên liệu khi đổi loại
   */
  function updateMaterialOptions(typeSelect) {
    const tr = typeSelect.closest('tr');
    const idSelect = tr.querySelector('.ing-id');
    const type = typeSelect.value;
    
    idSelect.innerHTML = '<option value="">-- Chọn nguyên liệu --</option>' + generateMaterialOptions(type);
    updateRowUnit(idSelect);
  }

  /**
   * Cập nhật đơn vị
   */
  function updateRowUnit(select) {
    const unitCell = select.closest('tr').querySelector('.ing-unit');
    const selectedOption = select.options[select.selectedIndex];
    const unit = selectedOption ? selectedOption.getAttribute('data-unit') : '';
    unitCell.innerText = unit || '-';
  }

  /**
   * Lưu công thức
   */
  function saveRecipeData() {
    if (!SELECTED_PRODUCT_ID) return;

    const rows = document.querySelectorAll('#recipeTableBody tr');
    const ingredients = [];
    let isValid = true;

    rows.forEach(row => {
      const typeEl = row.querySelector('.ing-type');
      const idEl = row.querySelector('.ing-id');
      const qtyEl = row.querySelector('.ing-qty');
      const unitEl = row.querySelector('.ing-unit');
      
      if (!typeEl || !idEl || !qtyEl) return;

      const type = typeEl.value;
      const id = idEl.value;
      const qty = qtyEl.value;
      const unit = unitEl.innerText;

      if (id && qty > 0) {
        ingredients.push({
          material_type: type,
          material_id: id,
          quantity: Number(qty),
          unit: unit
        });
      } else if (id || qty > 0) {
        isValid = false;
      }
    });

    if (!isValid) {
      showToast('Vui lòng nhập đầy đủ thông tin nguyên liệu và số lượng.', 'error');
      return;
    }

    if (ingredients.length === 0) {
      if (!confirm('Công thức trống sẽ xóa công thức hiện tại của sản phẩm này. Bạn có chắc chắn?')) return;
    }

    const btn = document.querySelector('#recipeActions .btn-primary');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang lưu...';

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.innerHTML = originalText;
        if (res && res.success) {
          showToast('Lưu công thức thành công!');
        } else {
          showToast('Lỗi: ' + (res && res.error || 'Không xác định'), 'error');
        }
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.innerHTML = originalText;
        showToast('Lỗi kết nối: ' + err.message, 'error');
      })
      .saveRecipe(STATE.token, SELECTED_PRODUCT_ID, ingredients);
  }
</script>
